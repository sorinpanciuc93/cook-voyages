  subdomains:'abcd',maxZoom:19
}).addTo(map);

let layers=[], currentV=1;

// ─────────────────────────────────────────
//  NORMALIZE COORDS (antimeridian fix)
// ─────────────────────────────────────────
function normCoords(steps){
  const out=[[steps[0].lat,steps[0].lng]];
  for(let i=1;i<steps.length;i++){
    let lng=steps[i].lng;
    const prev=out[i-1][1];
    while(lng-prev>180) lng-=360;
    while(lng-prev<-180) lng+=360;
    out.push([steps[i].lat,lng]);
  }
  return out;
}

function showVoyage(n){
  currentV=n;

  // tabs
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',i+1===n);
  });

  // clear layers
  layers.forEach(l=>map.removeLayer(l));
  layers=[];

  const v=V[n];

  // header
  document.getElementById('vheader').innerHTML=`
    <h2 style="color:${v.color}">${v.title}</h2>
    <div class="meta">📅 ${v.dates} &nbsp;·&nbsp; ⛵ ${v.ship}</div>
    <div class="blurb">${v.blurb}</div>
  `;

  // timeline
  const tl=document.getElementById('timeline');
  tl.innerHTML='';
  tl.className='timeline '+v.cls;
  v.steps.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='ti '+v.cls;
    el.id='ti-'+i;
    el.innerHTML=`
      <div class="ti-num">${i+1}</div>
      <div class="ti-body">
        <div class="ti-date">${s.d}</div>
        <div class="ti-loc">${s.loc}</div>
        <div class="ti-desc">${s.desc}</div>
      </div>`;
    el.onclick=()=>flyTo(i);
    tl.appendChild(el);
  });

  // route polyline
  const coords=normCoords(v.steps);
  const line=L.polyline(coords,{color:v.color,weight:2.5,opacity:.75,dashArray:'7 5'}).addTo(map);
  layers.push(line);

  // markers
  v.steps.forEach((s,i)=>{
    const nc=coords[i];
    const isKilled=s.loc.includes('Cook Killed');
    const isFirst=i===0;
    const isLast=i===v.steps.length-1;
    const bg = isKilled?'#cc0000': isFirst||isLast?'#ffffff':v.color;
    const fc = isFirst||isLast?'#0a1929':isKilled?'#ffffff':'#0a1929';

    const icon=L.divIcon({
      html:`<div style="
        width:${isKilled?28:22}px;height:${isKilled?28:22}px;border-radius:50%;
        background:${bg};border:2px solid ${isKilled?'#ff0000':v.color};
        display:flex;align-items:center;justify-content:center;
        font-size:${i>=99?8:10}px;font-weight:bold;color:${fc};
        box-shadow:0 0 ${isKilled?'12px #ff000099':'8px '+v.color+'66'};
        cursor:pointer;transition:transform .15s;
      ">${isKilled?'✕':i+1}</div>`,
      className:'',iconSize:[isKilled?28:22,isKilled?28:22],iconAnchor:[isKilled?14:11,isKilled?14:11]
    });

    const mk=L.marker(nc,{icon}).addTo(map).bindPopup(`
      <div class="pop-date">${s.d}</div>
      <div class="pop-title">${s.loc}</div>
      <div class="pop-desc">${s.desc}</div>
    `,{maxWidth:280});

    mk.on('click',()=>setActive(i));
    layers.push(mk);
  });

  // fit bounds using original coords (handles wrap better)
  map.fitBounds(V[n].steps.map(s=>[s.lat,s.lng]),{padding:[40,40]});
}

// ─────────────────────────────────────────
//  FLY TO
// ─────────────────────────────────────────
function flyTo(i){
  setActive(i);
  const nc=normCoords(V[currentV].steps);
  const mk=layers.filter(l=>l instanceof L.Marker)[i];
  map.flyTo(nc[i],5,{duration:1.4});
  setTimeout(()=>mk&&mk.openPopup(),1500);
}

function setActive(i){
  document.querySelectorAll('.ti').forEach((el,j)=>{
    el.classList.toggle('selected',j===i);
  });
  const el=document.getElementById('ti-'+i);
  if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
showVoyage(1);
</script>
</body>
